<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE.</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; }
    #archiveFrame {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: calc(100% - 82px);
        border: 0;
        background: #0f0f0f;
    }
    .music-player {
        position: fixed;
        z-index: 10000;
        left: 0;
        bottom: 0;
        width: 100%;
        color: #eee;
        background: rgba(15, 15, 15, .98);
        border-top: 1px solid #333;
        backdrop-filter: blur(15px);
        font-family: Arial, sans-serif;
    }
    .player-main {
        min-height: 82px;
        max-width: 1200px;
        margin: auto;
        padding: 12px 25px;
        display: flex;
        align-items: center;
        gap: 22px;
    }
    .track-info { flex: 1; min-width: 0; }
    .track-label { font-size: 9px; letter-spacing: 2px; color: #777; margin-bottom: 6px; }
    .track-name { font-size: 13px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 11px; color: #777; margin-top: 4px; }
    .player-controls { display: flex; align-items: center; gap: 14px; }
    .player-btn { border: 0; background: none; color: #ddd; font-size: 19px; cursor: pointer; padding: 5px; }
    .player-btn:hover { color: white; }
    .play-btn { width: 38px; height: 38px; border: 1px solid #555; border-radius: 50%; font-size: 15px; }
    .progress-area { flex: 1.5; display: flex; align-items: center; gap: 9px; min-width: 100px; }
    .time { color: #777; font-size: 10px; min-width: 30px; }
    .progress, .volume { accent-color: #eee; cursor: pointer; }
    .progress { width: 100%; height: 3px; }
    .player-extra { display: flex; align-items: center; gap: 10px; }
    .volume { width: 65px; }
    .playlist-toggle { border: 1px solid #444; background: none; color: #aaa; padding: 8px 11px; font-size: 9px; letter-spacing: 1px; cursor: pointer; }
    .playlist-toggle:hover { color: white; border-color: #888; }
    .playlist { display: none; max-width: 1200px; max-height: 220px; overflow-y: auto; margin: auto; padding: 5px 25px 15px; border-top: 1px solid #292929; }
    .playlist.open { display: block; }
    .playlist-item { display: flex; align-items: center; gap: 15px; padding: 11px 5px; border-bottom: 1px solid #242424; cursor: pointer; color: #888; font-size: 12px; }
    .playlist-item:hover, .playlist-item.active { color: white; }
    .playlist-number { color: #555; font-size: 10px; width: 20px; }
    .playlist-artist { margin-left: auto; color: #666; font-size: 11px; }
    @media (max-width: 650px) {
        #archiveFrame { height: calc(100% - 108px); }
        .player-main { min-height: 108px; padding: 10px 13px; gap: 9px; flex-wrap: wrap; }
        .track-info { width: calc(100% - 110px); flex: none; }
        .player-controls { margin-left: auto; gap: 8px; }
        .progress-area { order: 3; flex: 1 1 100%; }
        .player-extra { display: none; }
        .playlist { padding-left: 14px; padding-right: 14px; }
        .playlist-artist { display: none; }
    }

.archive-clock{position:fixed;top:18px;right:24px;z-index:10001;color:#888;font:10px/1.5 "Courier New",monospace;letter-spacing:1px;text-align:right;pointer-events:none;text-shadow:0 1px 5px #000}
.archive-loader{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;background:#0b0b0b;color:#bdbdbd;font:11px "Courier New",monospace;letter-spacing:3px;transition:opacity .45s ease,visibility .45s ease}
.archive-loader.hidden{opacity:0;visibility:hidden}
.archive-global-film{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.075;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");animation:shellFlicker 5s steps(2,end) infinite}
@keyframes shellFlicker{0%,100%{opacity:.06}48%{opacity:.09}50%{opacity:.055}}
@media(max-width:650px){.archive-clock{top:13px;right:14px;font-size:9px}}
@media(prefers-reduced-motion:reduce){.archive-global-film{animation:none}.archive-loader{transition:none}}

</style>
</head>
<body>
<div class="archive-loader" id="archiveLoader">INITIALIZING ARCHIVE...</div>
<div class="archive-clock" id="archiveClock">--.--.----<br>--:--:--</div>
<div class="archive-global-film" aria-hidden="true"></div>
<iframe id="archiveFrame" name="archiveFrame" src="home.html" title="ARCHIVE"></iframe>

<div class="music-player">
    <div class="player-main">
        <div class="track-info">
            <div class="track-label">NOW PLAYING</div>
            <div class="track-name" id="trackName">Выбери композицию</div>
            <div class="track-artist" id="trackArtist">ARCHIVE. PLAYLIST</div>
        </div>
        <div class="player-controls">
            <button class="player-btn" id="prevBtn" title="Предыдущий трек">|◀</button>
            <button class="player-btn play-btn" id="playBtn" title="Воспроизвести">▶</button>
            <button class="player-btn" id="nextBtn" title="Следующий трек">▶|</button>
        </div>
        <div class="progress-area">
            <span class="time" id="currentTime">0:00</span>
            <input class="progress" id="progress" type="range" min="0" max="100" value="0">
            <span class="time" id="duration">0:00</span>
        </div>
        <div class="player-extra">
            <span style="font-size:12px;color:#777;">♪</span>
            <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.7">
        </div>
        <button class="playlist-toggle" id="playlistToggle">PLAYLIST +</button>
    </div>
    <div class="playlist" id="playlist"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const tracks = [
    { name: "Beverly Hills", artist: "Пошлая Молли", file: "Music/Beverly Hills.mp3" },
    { name: "Do ya like X Resonance sped up", artist: "Childish Gambino", file: "Music/Do ya like X Resonance sped up.mp3" },
    { name: "doing it wrong slowed", artist: "Drake", file: "Music/doing it wrong slowed.mp3" },
    { name: "Careless whisper (slowed)", artist: "George Michael", file: "Music/george_michael_slowed.mp3" },
    { name: "Jungle (slowed & reverb)", artist: "Drake", file: "Music/jungle slowed.mp3" },
    { name: "Tried our best (slowed + reverb)", artist: "Drake", file: "Music/tried our best slowed.mp3" },
    { name: "Кнопка", artist: "Валентин Стрыкало", file: "Music/Кнопка.mp3" }
];

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const trackName = document.getElementById("trackName");
const trackArtist = document.getElementById("trackArtist");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const volume = document.getElementById("volume");
const playlist = document.getElementById("playlist");
const playlistToggle = document.getElementById("playlistToggle");
let currentTrack = 0;

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    return Math.floor(seconds / 60) + ":" + String(Math.floor(seconds % 60)).padStart(2, "0");
}
function loadTrack(index) {
    currentTrack = (index + tracks.length) % tracks.length;
    const track = tracks[currentTrack];
    audio.src = track.file;
    trackName.textContent = track.name;
    trackArtist.textContent = track.artist;
    progress.value = 0;
    currentTime.textContent = "0:00";
    duration.textContent = "0:00";
    updatePlaylist();
}
function playTrack() {
    audio.play().then(() => playBtn.textContent = "Ⅱ")
        .catch(() => {
            playBtn.textContent = "▶";
            alert("Не удалось воспроизвести файл. Проверь папку Music и названия MP3.");
        });
}
function pauseTrack() { audio.pause(); playBtn.textContent = "▶"; }

playBtn.addEventListener("click", () => audio.paused ? playTrack() : pauseTrack());
document.getElementById("prevBtn").addEventListener("click", () => { loadTrack(currentTrack - 1); playTrack(); });
document.getElementById("nextBtn").addEventListener("click", () => { loadTrack(currentTrack + 1); playTrack(); });
audio.addEventListener("ended", () => { loadTrack(currentTrack + 1); playTrack(); });
audio.addEventListener("loadedmetadata", () => duration.textContent = formatTime(audio.duration));
audio.addEventListener("timeupdate", () => {
    if (audio.duration) {
        progress.value = audio.currentTime / audio.duration * 100;
        currentTime.textContent = formatTime(audio.currentTime);
    }
});
progress.addEventListener("input", () => {
    if (audio.duration) audio.currentTime = progress.value / 100 * audio.duration;
});
volume.addEventListener("input", () => audio.volume = Number(volume.value));
playlistToggle.addEventListener("click", () => {
    playlist.classList.toggle("open");
    playlistToggle.textContent = playlist.classList.contains("open") ? "PLAYLIST −" : "PLAYLIST +";
});
function updatePlaylist() {
    playlist.innerHTML = "";
    tracks.forEach((track, index) => {
        const item = document.createElement("div");
        item.className = "playlist-item" + (index === currentTrack ? " active" : "");
        const number = document.createElement("span");
        number.className = "playlist-number";
        number.textContent = String(index + 1).padStart(2, "0");
        const name = document.createElement("span");
        name.textContent = track.name;
        const artist = document.createElement("span");
        artist.className = "playlist-artist";
        artist.textContent = track.artist;
        item.append(number, name, artist);
        item.addEventListener("click", () => { loadTrack(index); playTrack(); });
        playlist.appendChild(item);
    });
}
audio.volume = 0.7;
loadTrack(0);

function updateArchiveClock(){
 const now=new Date();
 const date=now.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"});
 const time=now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
 document.getElementById("archiveClock").innerHTML=date+"<br>"+time;
}
updateArchiveClock();setInterval(updateArchiveClock,1000);
window.addEventListener("load",()=>{setTimeout(()=>document.getElementById("archiveLoader").classList.add("hidden"),950)});

</script>
</body>
</html>
